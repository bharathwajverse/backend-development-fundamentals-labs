name: Verify Labs Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-lab-03:
    name: Verify Lab 03 REST Endpoints
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./lab-03
        run: npm install

      - name: Execute Automated Test Runner
        working-directory: ./lab-03
        run: npm test
